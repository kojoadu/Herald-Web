[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "herald-web"
version = "0.1.0"
description = "Streamlit portal for the Herald cloud song pool"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.41,<2",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools]
packages = ["services", "models"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
